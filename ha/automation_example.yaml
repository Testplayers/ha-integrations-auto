# 把这段追加到 HA 的 automations.yaml（或直接在界面上创建同样的自动化）
# 作用：每周一 12:00 自动从 GitHub 拉取集成更新（有更新才重启 HA）
# 时间安排在 12:00 是因为 GitHub Actions 每周一 10:00（北京时间）先检查上游并提交

- id: auto_sync_integrations
  alias: 每周同步集成更新
  description: 从 Testplayers/ha-integrations-auto 拉取水/电/气集成最新版本（GitHub Actions 周一 10:00 先检查）
  triggers:
    - trigger: time
      at: "12:00:00"
  conditions:
    - condition: time
      weekday: [mon]
  actions:
    - action: shell_command.sync_integrations
  mode: single
